<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRAND OFF 業務ツール</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;background:#f5f7fb;color:#222}
.wrap{max-width:720px;margin:auto;padding:42px 18px}
.card{background:#fff;border:1px solid #dfe3ea;border-radius:18px;padding:26px;box-shadow:0 4px 16px rgba(0,0,0,.04)}
h1{margin:0 0 8px;font-size:28px}.sub{color:#666;line-height:1.6;margin-bottom:24px}
.tool{display:block;text-decoration:none;color:#222;border:1px solid #dfe3ea;border-radius:14px;padding:20px;margin:14px 0;background:#fff;transition:.15s}
.tool:hover{background:#f8fafc;transform:translateY(-1px)}
.title{font-size:21px;font-weight:800;margin-bottom:5px}.desc{font-size:14px;color:#666;line-height:1.5}
.arrow{float:right;font-size:24px;color:#777}.note{font-size:12px;color:#888;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>BRAND OFF 業務ツール</h1>
    <div class="sub">使用するツールを選んでください。</div>

    <a class="tool" href="during.html">
      <span class="arrow">›</span>
      <div class="title">接客時チェック</div>
      <div class="desc">接客中の確認事項・ポイント・買取保証などをチェック</div>
    </a>

    <a class="tool" href="after.html">
      <span class="arrow">›</span>
      <div class="title">接客後チェック</div>
      <div class="desc">接客後の登録・処理・ファイリングなどの作業漏れを防止</div>
    </a>

    <div class="note">各ツールの内容を更新しても、ファイル名を変えなければこの入口ページのURLはそのまま使えます。</div>
  </div>
</div>
</body>
</html>
